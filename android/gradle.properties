org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Base URL of your SmartCalc AI backend.
# 10.0.2.2 is "localhost of the host machine" seen from the Android emulator.
# Override it here, in local.properties, or with -PSMARTCALC_BACKEND_URL=... on the command line.
# NOTE: this is NOT a secret. API keys live only on the backend.
SMARTCALC_BACKEND_URL=http://10.0.2.2:3000/
